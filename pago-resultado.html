<!DOCTYPE html><html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="Consulta el estado de tu pago de una experiencia con Dunas &amp; Olas en Cartagena de Indias.">
    <title>Estado de tu pago | Dunas &amp; Olas</title>
    <link rel="canonical" href="https://dunasyolas.com/pago-resultado">
    
    <link href="./css/tailwind.css" rel="stylesheet">
    <link rel="preload" href="css/fontawesome-local.min.css?v=20260911a" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="css/fontawesome-local.min.css?v=20260911a"/></noscript>
    <style>body{font-family:Montserrat,Arial,sans-serif;background:#f8f6fb}</style>
    <link rel="stylesheet" href="css/brand-refresh.css?v=20260911a">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/png" href="/images/favicon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="/images/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"></head>
  <body class="min-h-screen flex items-center justify-center p-5 text-gray-800">
    <main class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-gray-100 p-7 md:p-10 text-center">
      <img src="images/logo-master.webp" alt="Dunas &amp; Olas" width="1260" height="592" class="h-20 w-auto mx-auto mb-5" loading="eager" decoding="async">
      <div id="payment-icon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5 text-2xl"></div>
      <h1 id="payment-title" class="text-2xl md:text-3xl font-extrabold text-[#241B35] mb-3"></h1>
      <p id="payment-copy" class="text-gray-600 leading-relaxed mb-7"></p>
      <p id="payment-reference" class="hidden text-xs text-gray-400 mb-6"></p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <a href="experiences.html" class="bg-[#5B3A82] text-white font-bold px-6 py-3 rounded-lg" style="background:#5B3A82;color:#fff;padding:.75rem 1.5rem;border-radius:.5rem;">Ver experiencias</a>
        <a href="https://wa.me/573163030589?text=Hola%2C%20quiero%20confirmar%20el%20estado%20de%20mi%20pago%20con%20Dunas%20%26%20Olas." class="border border-[#25D366] text-[#128C4A] font-bold px-6 py-3 rounded-lg">Hablar por WhatsApp</a>
      </div>
      <p class="text-xs text-gray-400 mt-7">El pago no confirma por sí solo la disponibilidad del operador. Nuestro equipo verificará tu reserva y se comunicará contigo.</p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const status = params.get("status") || "pending";
      const paymentId = params.get("payment_id");
      const states = {
        approved: {
          icon: "fa-check",
          iconClass: "bg-green-100 text-green-700",
          title: "Verifiquemos el resultado de tu pago",
          copy: "Has regresado del proceso de pago. Esta página no verifica la transacción: consulta el comprobante de Mercado Pago y comparte la referencia con nuestro equipo para confirmar el pago y la disponibilidad."
        },
        failure: {
          icon: "fa-xmark",
          iconClass: "bg-red-100 text-red-700",
          title: "El pago no pudo completarse",
          copy: "Puedes intentarlo nuevamente desde el carrito o escribirnos para revisar otra forma de pago."
        },
        pending: {
          icon: "fa-clock",
          iconClass: "bg-yellow-100 text-yellow-700",
          title: "Tu pago está pendiente",
          copy: "Mercado Pago todavía está procesando la operación. Te recomendamos esperar la confirmación antes de volver a pagar."
        }
      };
      const state = states[status] || states.pending;
      document.getElementById("payment-icon").className += ` ${state.iconClass}`;
      document.getElementById("payment-icon").innerHTML = `<i class="fas ${state.icon}"></i>`;
      document.getElementById("payment-title").textContent = state.title;
      document.getElementById("payment-copy").textContent = state.copy;
      if (paymentId) {
        const reference = document.getElementById("payment-reference");
        reference.textContent = `Referencia de Mercado Pago: ${paymentId}`;
        reference.classList.remove("hidden");
      }
    </script>
    <script src="/js/site-refresh.js?v=20260911b" defer=""></script>


</body></html>
